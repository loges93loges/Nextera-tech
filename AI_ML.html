<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0077ff, #00c6ff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contact-container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 450px;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .contact-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
      color: #555;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #0077ff;
      box-shadow: 0 0 5px rgba(0,119,255,0.3);
    }

    .form-group textarea {
      resize: none;
      height: 120px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #0077ff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: #005ec4;
    }

    .success-msg {
      text-align: center;
      color: green;
      font-weight: 500;
      margin-top: 10px;
    }

    .error-msg {
      text-align: center;
      color: red;
      font-weight: 500;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <h2>📩 Contact Us</h2>
    <form id="contactForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="phone">Contact Number</label>
        <input type="tel" id="phone" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>
    <p id="statusMsg"></p>
  </div>

<!-- Firebase SDK -->
<script type="module">
  // Import Firebase SDK (v9+ modular)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

  // Your Firebase config (from project settings)
  const firebaseConfig = {
  apiKey: "AIzaSyBGOGuz82Eszr-whr0gjW2w5ESHPHek2G0",
  authDomain: "nextera-db8bc.firebaseapp.com",
  projectId: "nextera-db8bc",
  storageBucket: "nextera-db8bc.firebasestorage.app",
  messagingSenderId: "913134889390",
  appId: "1:913134889390:web:20442727043f138b09c03f",
  measurementId: "G-0TSTEBT983"
};
  // Init Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Handle form submit
  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let message = document.getElementById("message").value;

    try {
      await addDoc(collection(db, "messages"), {
        name,
        phone,
        message,
        timestamp: new Date()
      });

      alert("✅ Message saved to Firestore!");
      document.getElementById("contactForm").reset();
    } catch (err) {
      console.error("❌ Firestore Error:", err);
      alert("Error: " + err.message);
    }
  });


  try {
  // Save in Firestore
  await addDoc(collection(db, "contacts"), {
    name,
    phone,
    message,
    timestamp: new Date()
  });

  // Send SMS to admin
  let smsText = `New Enquiry!\nName: ${name}\nPhone: ${phone}\nMessage: ${message}`;

  await fetch("https://www.fast2sms.com/dev/bulkV2", {
    method: "POST",
    headers: {
      "authorization": "ay6zrd5kiZL9omKceGI0OqSjVvBlFJU7xnPChu4swX1YADRH2p1loYX2ndkQxaZTVEBLRDNHAqJKb5Iv", // ⚠️ visible in frontend
      "accept": "application/json",
      "content-type": "application/json"
    },
    body: JSON.stringify({
      route: "v3",
      sender_id: "TXTIND",
      message: smsText,
      language: "english",
      flash: 0,
      numbers: "6369327027"
    })
  });

  alert("✅ Message saved & SMS sent to admin!");
  document.getElementById("contactForm").reset();

} catch(err) {
  console.error(err);
  alert("⚠️ Error: " + err.message);
}

</script>

</body>
</html>
